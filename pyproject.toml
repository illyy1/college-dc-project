[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "room-hardware-monitor"
version = "0.1.0"
description = "Tracks workstation cameras and microphones, raises alerts and assigns maintenance calls to technicians."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography",   # decrypts the GitHub token stored in .env (--live and --dashboard only)
    "python-dotenv",  # loads .env
    "requests",       # GitHub issues and the Gemini triage
]

[project.optional-dependencies]
test = ["pytest"]     # pip install -e ".[test]", then: pytest

[tool.setuptools]
packages = ["hardware_monitor"]
